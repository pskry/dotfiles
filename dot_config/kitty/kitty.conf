#
# ~/.config/kitty/kitty.conf
#
# Defaults: kitty +runpy "from kitty.config import *; print_defaults()"

# Colors come from {dark,light,no-preference}-theme.auto.conf, which kitty switches between
# as the OS appearance changes. A theme included here would win over them.

font_family      JetBrainsMono Nerd Font
font_size        13.0

cursor_shape          block
cursor_blink_interval 0

mouse_hide_wait -1

enable_audio_bell no

tab_bar_style powerline

# No kitty tabs: tmux does that job. A map with no action hands the key to the program.
map kitty_mod+t
map kitty_mod+q
map kitty_mod+right
map kitty_mod+left
map kitty_mod+.
map kitty_mod+,
map kitty_mod+alt+t
map ctrl+tab
map ctrl+shift+tab
map cmd+t
map cmd+w
map shift+cmd+i
map shift+cmd+]
map shift+cmd+[

# `left`: right Option keeps composing accented characters.
macos_titlebar_color  system
macos_option_as_alt   left

include ${KITTY_OS}.conf

# vim:ts=2:sw=2:ft=kitty:fenc=utf-8
